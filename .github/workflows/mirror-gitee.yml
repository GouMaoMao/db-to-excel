name: 同步到 Gitee

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: 只补推这个版本标签，例如 v1.0.6。留空则补推 main 和全部三段版本标签。不上传安装包。
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: 镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MIRROR_TAG: ${{ inputs.tag }}
        run: bash scripts/mirror-gitee.sh
